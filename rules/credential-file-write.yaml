id: credential-file-write
appliesTo: file_write
field: filePath
match:
  kind: regex
  pattern: '(\.ssh\/|(^|\/)\.env(\.(?!example|sample|template)[\w-]+)?$|id_rsa(?!\.pub)\b|id_ed25519(?!\.pub)\b|(^|\/)credentials(\.json)?$|\.aws\/credentials|\.npmrc$|\.pem$)'
  flags: 'i'
severity: high
message: 'Writes to a path that commonly holds credentials or private keys'
