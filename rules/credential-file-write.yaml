id: credential-file-write
appliesTo: file_write
field: filePath
match:
  kind: regex
  pattern: '(\.ssh\/|(^|\/)\.env(\.|$)|id_rsa|id_ed25519|(^|\/)credentials(\.json)?$|\.aws\/credentials|\.npmrc$|\.pem$)'
  flags: 'i'
severity: high
message: 'Writes to a path that commonly holds credentials or private keys'
