id: unallowlisted-network-host
appliesTo: network
field: url
match:
  kind: domain_allowlist
  domains:
    - github.com
    - raw.githubusercontent.com
    - api.anthropic.com
    - registry.npmjs.org
    - pypi.org
severity: medium
message: 'Outbound request to a host not on the default allowlist'
